<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Schema: Ablauf der INUSpherese — Blut wird entnommen, Plasma separiert, im TKM-58-Filter gereinigt und zurückgeführt" font-family="'Noto Sans', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#257684"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#54565A"/>
    </marker>
  </defs>

  <!-- Patient -->
  <g>
    <circle cx="110" cy="120" r="26" fill="#3BAFBF"/>
    <path d="M62 235 v-40 a48 48 0 0 1 96 0 v40 z" fill="#3BAFBF"/>
    <text x="110" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#26282C">Patient:in</text>
  </g>

  <!-- Vollblut: patient -> separator -->
  <path d="M170 150 H320" fill="none" stroke="#257684" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="245" y="138" text-anchor="middle" font-size="14" fill="#26282C">Vollblut</text>

  <!-- Plasmaseparator -->
  <g>
    <rect x="330" y="85" width="120" height="150" rx="14" fill="#E7F5F7" stroke="#3BAFBF" stroke-width="2.5"/>
    <rect x="352" y="105" width="76" height="110" rx="10" fill="#3BAFBF" opacity=".25"/>
    <line x1="365" y1="115" x2="365" y2="205" stroke="#257684" stroke-width="2"/>
    <line x1="390" y1="115" x2="390" y2="205" stroke="#257684" stroke-width="2"/>
    <line x1="415" y1="115" x2="415" y2="205" stroke="#257684" stroke-width="2"/>
    <text x="390" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#26282C">Plasmaseparator</text>
  </g>

  <!-- Plasma: separator -> filter -->
  <path d="M450 150 H570" fill="none" stroke="#257684" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="138" text-anchor="middle" font-size="14" fill="#26282C">Plasma</text>

  <!-- TKM-58 Filter -->
  <g>
    <rect x="580" y="85" width="120" height="150" rx="14" fill="#E7F5F7" stroke="#257684" stroke-width="2.5"/>
    <g stroke="#257684" stroke-width="1.75" opacity=".8">
      <line x1="598" y1="110" x2="682" y2="110"/>
      <line x1="598" y1="130" x2="682" y2="130"/>
      <line x1="598" y1="150" x2="682" y2="150"/>
      <line x1="598" y1="170" x2="682" y2="170"/>
      <line x1="598" y1="190" x2="682" y2="190"/>
      <line x1="612" y1="98" x2="612" y2="202"/>
      <line x1="640" y1="98" x2="640" y2="202"/>
      <line x1="668" y1="98" x2="668" y2="202"/>
    </g>
    <text x="640" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#26282C">TKM-58-Filter</text>
  </g>

  <!-- Eluat (toxins) out -->
  <path d="M700 200 H760 V280" fill="none" stroke="#54565A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <rect x="712" y="288" width="96" height="44" rx="10" fill="#EEEFF0" stroke="#54565A" stroke-width="2"/>
  <text x="760" y="306" text-anchor="middle" font-size="12.5" font-weight="600" fill="#54565A">Eluat</text>
  <text x="760" y="322" text-anchor="middle" font-size="12.5" fill="#54565A">(Schadstoffe)</text>

  <!-- Cleaned plasma return: filter -> around -> patient -->
  <path d="M700 110 H830 Q850 110 850 130 V300 Q850 320 830 320 H200 Q180 320 180 300 V245" fill="none" stroke="#257684" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="500" y="342" text-anchor="middle" font-size="14" fill="#26282C">Gereinigtes Blut zurück zur Patientin / zum Patienten</text>

  <!-- Blood cells bypass: separator -> return line -->
  <path d="M390 235 V300 Q390 312 402 314" fill="none" stroke="#3BAFBF" stroke-width="2.5" stroke-dasharray="2 5"/>
  <text x="330" y="296" text-anchor="middle" font-size="12.5" fill="#54565A">Blutzellen</text>
</svg>
